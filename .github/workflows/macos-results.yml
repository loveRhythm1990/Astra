name: Mac CI hosted result observer
on:
  workflow_run:
    workflows: [Test Suite]
    types: [completed]
permissions:
  contents: read
cache-mode: none
jobs:
  observe:
    if: github.repository == 'matrixorigin/Astra' && vars.ASTRA_MACOS_MIGRATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: astra-macos-control
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.ASTRA_MACOS_APP_ID }}
          private-key: ${{ secrets.ASTRA_MACOS_APP_PRIVATE_KEY }}
          owner: matrixorigin
          repositories: Astra
          permission-members: read
          permission-organization-self-hosted-runners: read
          permission-administration: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-environments: read
      # No PR checkout, downloaded artifacts, code execution or cached scripts.
      - name: Observe ordinary hosted results
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ASTRA_MACOS_APP_ID: ${{ vars.ASTRA_MACOS_APP_ID }}
        run: python3 scripts/ci/macos_runner.py observe
