name: Mac CI

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Member PR to re-authorize and execute on hosted macOS
        required: true
        type: string

permissions:
  contents: read
cache-mode: read
concurrency:
  group: mac-ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  ASTRA_MACOS_APP_ID: ${{ vars.ASTRA_MACOS_APP_ID }}

jobs:
  plan:
    if: >-
      github.repository == 'matrixorigin/Astra' &&
      vars.ASTRA_MACOS_MIGRATION_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: astra-macos-control
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      route: ${{ steps.plan.outputs.route }}
      merge: ${{ steps.plan.outputs.merge }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.ASTRA_MACOS_APP_ID }}
          private-key: ${{ secrets.ASTRA_MACOS_APP_PRIVATE_KEY }}
          owner: matrixorigin
          repositories: Astra
          permission-members: read
          permission-organization-self-hosted-runners: read
          permission-administration: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-environments: read
      - id: plan
        name: Verify source, membership and enforcement
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ASTRA_MACOS_GROUP_ID: ${{ vars.ASTRA_MACOS_GROUP_ID }}
          ASTRA_MACOS_MAIN_GROUP_ID: ${{ vars.ASTRA_MACOS_MAIN_GROUP_ID }}
          ASTRA_MACOS_MAIN_ISOLATED: ${{ vars.ASTRA_MACOS_MAIN_ISOLATED }}
        run: python3 scripts/ci/macos_runner.py plan

  mini:
    name: Migrated macOS lanes
    needs: plan
    if: needs.plan.outputs.route == 'self-hosted'
    runs-on:
      group: astra-macos-${{ needs.plan.outputs.kind }}
      labels: [self-hosted, macOS, ARM64, mac-arm64-mini, astra-macos-admitted]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # The root-owned job-started hook runs before even this step, including
      # individual/failed-only reruns. Its separate credential owner is mandatory.
      - name: Verify admitted platform and capacity
        timeout-minutes: 2
        shell: bash
        run: /opt/astra-ci/bin/preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: _mac_control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.merge }}
          path: _mac_source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: _mac_source/.nvmrc
      - name: Run all three macOS lanes
        shell: bash
        working-directory: _mac_source
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/astra-macos-${{ github.run_id }}-${{ github.run_attempt }}/target
          npm_config_cache: ${{ runner.temp }}/astra-macos-${{ github.run_id }}-${{ github.run_attempt }}/npm
        run: bash ../_mac_control/scripts/ci/run-macos-lanes.sh all
      - name: Remove job artifacts
        shell: bash
        if: always()
        run: rm -rf "${RUNNER_TEMP}/astra-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  hosted-admission:
    needs: [plan, mini]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.route == 'hosted' ||
      (needs.plan.outputs.route == 'self-hosted' && needs.mini.result == 'failure'))
    runs-on: ubuntu-latest
    environment: astra-macos-control
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.admission.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.ASTRA_MACOS_APP_ID }}
          private-key: ${{ secrets.ASTRA_MACOS_APP_PRIVATE_KEY }}
          owner: matrixorigin
          repositories: Astra
          permission-members: read
          permission-organization-self-hosted-runners: read
          permission-administration: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-environments: read
      - id: admission
        name: Fresh authorization for hosted handoff
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 scripts/ci/macos_runner.py refresh --plan "$PLAN"

  hosted:
    name: Fallback macOS lanes
    needs: [plan, hosted-admission]
    if: >-
      !cancelled() && needs.hosted-admission.result == 'success' &&
      needs.hosted-admission.outputs.allowed == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: _mac_control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.merge }}
          path: _mac_source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: _mac_source/.nvmrc
      - name: Run all three macOS lanes
        shell: bash
        working-directory: _mac_source
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/astra-macos-${{ github.run_id }}-${{ github.run_attempt }}/target
          npm_config_cache: ${{ runner.temp }}/astra-macos-${{ github.run_id }}-${{ github.run_attempt }}/npm
        run: bash ../_mac_control/scripts/ci/run-macos-lanes.sh all

  publish:
    needs: [plan, mini, hosted-admission, hosted]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: astra-macos-control
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.ASTRA_MACOS_APP_ID }}
          private-key: ${{ secrets.ASTRA_MACOS_APP_PRIVATE_KEY }}
          owner: matrixorigin
          repositories: Astra
          permission-members: read
          permission-organization-self-hosted-runners: read
          permission-administration: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-environments: read
      - name: Publish verified App-owned results
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 scripts/ci/macos_runner.py finish --plan "$PLAN"
