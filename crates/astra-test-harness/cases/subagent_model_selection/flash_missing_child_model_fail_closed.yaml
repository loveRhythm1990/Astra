name: flash_missing_child_model_fail_closed
description: |
  A missing configured-name selector must fail admission with invalid_request
  instead of silently falling back to the parent model. A missing Offering ID
  has a distinct tool_unavailable contract; this case targets configured names.
prompt: |
  下一步必须只调用一次 agent，使用以下参数：
  {"action":"spawn","description":"Missing configured model admission probe","prompt":"Reply ASTRA-MISSING-MODEL-MUST-NOT-RUN","requested_model_policy":{"mode":"fixed","selector":{"kind":"configured_name","model_name":"glm-99.99"}}}
  glm-99.99 是服务端配置模型名称，不是 Offering ID。保持 fixed 和
  configured_name selector，不要改为 offering_id，也不要省略模型策略。
  这个 spawn 应由运行时 admission 拒绝；不要先调用 model_catalog，不要
  换模型，不要重试，也不要用文字模拟拒绝。最终如实说明失败原因，并包含
  ASTRA-MISSING-MODEL-NOT-AVAILABLE。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: execution_tool_count
    name: agent
    min: 1
    max: 1
    root_only: true
    predicates:
      - document: arguments
        path: /action
        equals: spawn
      - document: arguments
        path: /requested_model_policy/mode
        equals: fixed
      - document: arguments
        path: /requested_model_policy/selector/kind
        equals: configured_name
      - document: arguments
        path: /requested_model_policy/selector/model_name
        equals: glm-99.99
  - type: execution_tool_count
    name: agent
    min: 1
    max: 1
    root_only: true
    ok: false
  - type: execution_tool_count
    name: agent
    min: 1
    max: 1
    ok: false
    root_only: true
    predicates:
      - document: arguments
        path: /action
        equals: spawn
      - document: result
        path: /error_kind
        equals: invalid_request
      - document: result
        path: /status
        equals: failed
  - type: text_contains
    needle: ASTRA-MISSING-MODEL-NOT-AVAILABLE
  - type: execution_child_count
    min: 0
    max: 0
  - type: execution_tool_count
    name: reflect
    min: 0
    max: 0
